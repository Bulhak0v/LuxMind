{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "LuxMind - Управління освітленням" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="text-center mb-4">
        <h2 class="text-primary">LuxMind</h2>
        <p class="text-muted">{% trans "Розумне вуличне освітлення" %}</p>

        <div class="btn-group btn-group-sm mt-2">
            <form action="{% url 'set_language' %}" method="post">
                {% csrf_token %}
                <input name="next" type="hidden" value="/">
                <button type="submit" name="language" value="uk" class="btn btn-outline-secondary {% if LANGUAGE_CODE == 'uk' %}active{% endif %}">UK</button>
                <button type="submit" name="language" value="en" class="btn btn-outline-secondary {% if LANGUAGE_CODE == 'en' %}active{% endif %}">EN</button>
            </form>
        </div>
    </div>

    <div id="login-view">
        <h4 class="mb-3">{% trans "Вхід в систему" %}</h4>
        <div id="login-error" class="alert alert-danger hidden"></div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">{% trans "Ім'я користувача" %}</label>
                <input type="text" id="login-username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Пароль" %}</label>
                <input type="password" id="login-password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">{% trans "Увійти" %}</button>
        </form>
        <div class="text-center mt-3">
            <a href="#" id="show-register" class="text-decoration-none">{% trans "Немає акаунту? Зареєструватися" %}</a>
        </div>
    </div>

    <div id="register-view" class="hidden">
        <h4 class="mb-3">{% trans "Реєстрація" %}</h4>
        <div id="register-message" class="alert hidden"></div>
        <form id="register-form">
            <div class="mb-3">
                <label class="form-label">{% trans "Ім'я користувача" %}</label>
                <input type="text" id="reg-username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Email" %}</label>
                <input type="email" id="reg-email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Пароль" %}</label>
                <input type="password" id="reg-password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Роль" %}</label>
                <select id="reg-role" class="form-select">
                    <option value="operator">{% trans "Оператор" %}</option>
                    <option value="admin">{% trans "Адміністратор" %}</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">{% trans "Створити акаунт" %}</button>
        </form>
        <div class="text-center mt-3">
            <a href="#" id="show-login" class="text-decoration-none text-muted">{% trans "Вже є акаунт? Увійти" %}</a>
        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
